databases:
  - name: setflow-db
    plan: free

envVarGroups: []

services:
  - type: web
    name: setflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: setflow-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
